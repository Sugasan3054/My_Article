<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>記事詳細 | 技術記事要約サイト</title>
  <meta name="description" content="技術記事・テック動画の要約詳細ページ。">
  <link rel="stylesheet" href="./src/css/base.css">
  <link rel="stylesheet" href="./src/css/components.css">
</head>
<body>
  <!-- Aurora WebGL アニメーション背景 -->
  <div id="aurora-bg" class="aurora-background" aria-hidden="true"></div>

  <!-- スキップリンク -->
  <a href="#main-content" class="skip-link">メインコンテンツへスキップ</a>

  <!-- ヘッダー -->
  <header class="site-header">
    <div class="site-container site-header-inner">
      <a href="./index.html" class="site-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span>Tech Summary Hub</span>
      </a>

      <nav aria-label="主要ナビゲーション">
        <ul class="site-nav-list">
          <li>
            <a href="./index.html" class="site-nav-link">記事一覧</a>
          </li>
          <li>
            <a href="./summarize.html" class="site-nav-link">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
              </svg>
              <span>要約ツール (自分用)</span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main id="main-content" class="site-main">
    <div class="site-container">
      <!-- パンくずリスト -->
      <nav class="breadcrumbs" aria-label="パンくずリスト">
        <ol class="breadcrumbs-list">
          <li class="breadcrumbs-item">
            <a href="./index.html">トップ</a>
          </li>
          <li class="breadcrumbs-item" aria-current="page" id="breadcrumb-title">
            読み込み中...
          </li>
        </ol>
      </nav>

      <!-- ローディング表示 -->
      <div id="article-loading" class="alert alert-info" role="status">
        <p>記事を読み込んでいます...</p>
      </div>

      <!-- 記事本文コンテナ -->
      <div id="article-container"></div>
    </div>
  </main>

  <!-- フッター -->
  <footer class="site-footer">
    <div class="site-container site-footer-inner">
      <div>
        <p><strong>Tech Summary Hub</strong> - GitHub Pagesでホスティングされた静的ナレッジベース</p>
      </div>
      <div>
        <a href="./index.html">← 記事一覧に戻る</a>
      </div>
    </div>
  </footer>

  <script type="module" src="./src/js/detail.js"></script>
</body>
</html>
